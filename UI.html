<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Screener</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --s1: #111;
    --s2: #181818;
    --s3: #222;
    --border: #282828;
    --border2: #333;
    --accent: #e8ff47;
    --accent2: #47d9ff;
    --accent3: #ff6b47;
    --text: #f0f0ee;
    --muted: #555;
    --muted2: #777;
    --high: #e8ff47;
    --medium: #ffc147;
    --low: #ff8c47;
    --uncertain: #ff4747;
    --good: #47ff8c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inconsolata', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(232,255,71,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 80% 80%, rgba(71,217,255,0.03) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    position: relative;
    z-index: 1;
  }

  header { margin-bottom: 56px; animation: fadeDown 0.7s cubic-bezier(0.16,1,0.3,1) both; }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .logo-mark { display: flex; align-items: center; gap: 10px; }

  .logo-square {
    width: 32px; height: 32px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 14px; color: #000;
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted2);
  }

  .status-pill { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.12em; color: var(--muted2); text-transform: uppercase; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); animation: pulse 2s ease infinite; }
  .status-dot.offline { background: var(--uncertain); animation: none; }

  h1 { font-family: 'Syne', sans-serif; font-size: clamp(48px, 8vw, 88px); font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; }
  h1 .line1 { display: block; color: var(--text); }
  h1 .line2 { display: block; color: var(--accent); }

  .tagline { margin-top: 20px; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; display: flex; gap: 20px; flex-wrap: wrap; }
  .tag-item { display: flex; align-items: center; gap: 6px; }
  .tag-item::before { content: '▸'; color: var(--accent); font-size: 10px; }

  #systemBar {
    background: var(--s1); border: 1px solid var(--border);
    padding: 12px 16px; margin-bottom: 28px;
    display: flex; gap: 24px; flex-wrap: wrap;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    animation: fadeUp 0.5s ease 0.3s both;
  }

  .sys-item { display: flex; align-items: center; gap: 6px; color: var(--muted2); }
  .sys-val { color: var(--accent); font-weight: 500; }
  .sys-val.na { color: var(--muted); }

  .panel { background: var(--s1); border: 1px solid var(--border); margin-bottom: 12px; animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both; }
  .panel-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
  .panel-body { padding: 20px; }

  textarea, input[type="text"], input[type="number"] {
    width: 100%; background: var(--s2); border: 1px solid var(--border);
    color: var(--text); font-family: 'Inconsolata', monospace;
    font-size: 13px; padding: 12px 14px; outline: none;
    resize: vertical; line-height: 1.6; transition: border-color 0.15s;
  }
  textarea:focus, input:focus { border-color: var(--accent); }
  textarea::placeholder, input::placeholder { color: var(--muted); }

  .resume-list { display: flex; flex-direction: column; gap: 8px; }

  .resume-row {
    background: var(--s2); border: 1px solid var(--border);
    padding: 12px; display: grid;
    grid-template-columns: 130px 1fr 32px;
    gap: 8px; align-items: start;
    animation: fadeUp 0.3s ease both;
  }

  .resume-row input { font-size: 12px; padding: 8px 10px; }
  .resume-row textarea { font-size: 12px; min-height: 64px; padding: 8px 10px; }

  .rm-btn {
    width: 32px; height: 32px; background: none;
    border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .rm-btn:hover { border-color: var(--uncertain); color: var(--uncertain); }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .btn {
    font-family: 'Inconsolata', monospace;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 9px 18px; cursor: pointer; border: none; transition: all 0.15s;
  }

  .btn-ghost { background: none; border: 1px solid var(--border2); color: var(--muted2); }
  .btn-ghost:hover { border-color: var(--text); color: var(--text); }

  .btn-primary { background: var(--accent); color: #000; font-weight: 700; flex: 1; padding: 13px; font-size: 12px; }
  .btn-primary:hover { background: #f0ff60; }
  .btn-primary:disabled { background: var(--s3); color: var(--muted); cursor: not-allowed; }

  .btn-secondary { background: none; border: 1px solid var(--accent2); color: var(--accent2); }
  .btn-secondary:hover { background: rgba(71,217,255,0.08); }
  .btn-secondary:disabled { border-color: var(--border); color: var(--muted); cursor: not-allowed; }

  .options-grid { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .opt-label { font-size: 11px; color: var(--muted2); letter-spacing: 0.08em; }
  input[type="number"] { width: 70px; resize: none; padding: 7px 10px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted2); cursor: pointer; }
  .checkbox-row input[type="checkbox"] { width: auto; accent-color: var(--accent); }

  #status { padding: 12px 16px; margin-bottom: 12px; font-size: 11px; letter-spacing: 0.08em; display: none; align-items: center; gap: 10px; }
  #status.loading { display: flex; background: var(--s1); border: 1px solid var(--border); color: var(--muted2); }
  #status.error { display: flex; background: rgba(255,71,71,0.06); border: 1px solid rgba(255,71,71,0.3); color: var(--uncertain); }

  .spinner { width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }

  #validationBox { display: none; background: rgba(255,193,71,0.05); border: 1px solid rgba(255,193,71,0.2); padding: 14px 16px; margin-bottom: 12px; font-size: 11px; color: var(--medium); letter-spacing: 0.06em; }
  .warn-item { margin-bottom: 4px; display: flex; gap: 8px; }
  .warn-item::before { content: '⚠'; flex-shrink: 0; }

  #results { display: none; }

  .results-top { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .results-heading { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -0.02em; }
  .results-meta { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-align: right; line-height: 1.8; }

  #metricsPanel { display: none; background: var(--s1); border: 1px solid var(--border); padding: 20px; margin-bottom: 16px; }

  .metrics-grade { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }

  .grade-circle { width: 64px; height: 64px; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; flex-direction: column; flex-shrink: 0; }
  .grade-letter { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--accent); line-height: 1; }
  .grade-label-text { font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted2); }
  .grade-verdict { font-size: 12px; color: var(--muted2); line-height: 1.6; flex: 1; }

  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }

  .metric-cell { background: var(--s2); border: 1px solid var(--border); padding: 10px 12px; }
  .metric-name { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .metric-val { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; line-height: 1; }
  .metric-grade { font-size: 9px; letter-spacing: 0.1em; margin-top: 2px; }

  .grade-A { color: var(--good); }
  .grade-B { color: var(--accent); }
  .grade-C { color: var(--medium); }
  .grade-D { color: var(--low); }
  .grade-F { color: var(--uncertain); }

  .result-card { background: var(--s1); border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; animation: fadeUp 0.4s cubic-bezier(0.16,1,0.3,1) both; transition: border-color 0.2s; }
  .result-card:hover { border-color: var(--border2); }

  .card-top { display: grid; grid-template-columns: 60px 1fr; }

  .rank-col { background: var(--s2); display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border); padding: 20px 0; }
  .rank-num { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--muted); }

  .rank-0 .rank-num { color: var(--high); }
  .rank-1 .rank-num { color: var(--medium); }
  .rank-2 .rank-num { color: var(--low); }

  .card-main { padding: 16px 20px; }

  .card-id-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .card-id { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }

  .confidence-badge { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; padding: 3px 8px; border: 1px solid; }
  .conf-high      { border-color: var(--high);      color: var(--high); }
  .conf-medium    { border-color: var(--medium);    color: var(--medium); }
  .conf-low       { border-color: var(--low);       color: var(--low); }
  .conf-uncertain { border-color: var(--uncertain); color: var(--uncertain); }

  .winner-badge { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; background: var(--accent); color: #000; font-weight: 700; }
  .fallback-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); border: 1px solid rgba(71,217,255,0.3); padding: 2px 6px; }

  .card-snippet { font-size: 11px; color: var(--muted2); line-height: 1.6; margin-bottom: 14px; max-height: 48px; overflow: hidden; }

  .scores-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .score-block { display: flex; flex-direction: column; gap: 4px; }
  .score-name { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .score-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .score-bar { width: 72px; height: 3px; background: var(--s3); position: relative; overflow: hidden; }
  .score-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width 1s cubic-bezier(0.16,1,0.3,1); }
  .rank-1 .score-fill { background: var(--medium); }
  .rank-2 .score-fill { background: var(--low); }
  .score-pct { font-size: 11px; color: var(--text); min-width: 32px; }

  .card-footer { border-top: 1px solid var(--border); padding: 10px 20px 10px 80px; font-size: 10px; color: var(--muted); letter-spacing: 0.04em; line-height: 1.6; display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .footer-reason { flex: 1; min-width: 200px; }
  .footer-gap { color: var(--muted); white-space: nowrap; }
  .footer-gap span { color: var(--text); }

  #faissBar { background: var(--s1); border: 1px solid var(--border); padding: 12px 16px; margin-bottom: 16px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: none; gap: 20px; flex-wrap: wrap; }
  .faiss-item { display: flex; gap: 6px; align-items: center; }
  .faiss-val { color: var(--accent2); }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(14px); }  to { opacity: 1; transform: translateY(0); } }
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes pulse    { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="top-bar">
      <div class="logo-mark">
        <div class="logo-square">RS</div>
        <div class="logo-text">Resume Screener</div>
      </div>
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">checking…</span>
      </div>
    </div>
    <h1>
      <span class="line1">SCREEN</span>
      <span class="line2">SMARTER.</span>
    </h1>
    <div class="tagline">
      <span class="tag-item">FAISS Vector Retrieval</span>
      <span class="tag-item">Cross-Encoder Reranking</span>
      <span class="tag-item">Confidence Scoring</span>
      <span class="tag-item">NDCG Evaluation</span>
    </div>
  </header>

  <div id="systemBar">
    <div class="sys-item">INDEX <span class="sys-val na" id="sysIndex">—</span></div>
    <div class="sys-item">VECTORS <span class="sys-val na" id="sysVectors">—</span></div>
    <div class="sys-item">DIM <span class="sys-val na" id="sysDim">—</span></div>
    <div class="sys-item">CACHE HIT <span class="sys-val na" id="sysCacheHit">—</span></div>
    <div class="sys-item">JOBS <span class="sys-val na" id="sysJobs">0</span></div>
  </div>

  <div class="panel" style="animation-delay:0.1s">
    <div class="panel-header"><div class="panel-title">01 — Job Description</div></div>
    <div class="panel-body">
      <textarea id="jd" rows="7" placeholder="Paste the full job description here…&#10;&#10;Include: role title, required skills, experience level, tech stack, responsibilities.&#10;Longer descriptions produce better ranking accuracy."></textarea>
    </div>
  </div>

  <div class="panel" style="animation-delay:0.15s">
    <div class="panel-header">
      <div class="panel-title">02 — Candidates</div>
      <div style="font-size:10px;color:var(--muted)" id="resumeCount">0 added</div>
    </div>
    <div class="panel-body">
      <div class="resume-list" id="resumeList"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="addResume()">+ Add Candidate</button>
        <button class="btn btn-ghost" onclick="loadExample()">Load Example</button>
        <button class="btn btn-ghost" onclick="clearAll()">Clear All</button>
      </div>
    </div>
  </div>

  <div class="panel" style="animation-delay:0.2s">
    <div class="panel-header"><div class="panel-title">03 — Options</div></div>
    <div class="panel-body">
      <div class="options-grid">
        <span class="opt-label">Show top</span>
        <input type="number" id="topN" value="5" min="1" max="20" style="width:60px">
        <span class="opt-label">results</span>
        <span style="flex:1"></span>
        <label class="checkbox-row">
          <input type="checkbox" id="withEval"> Enable evaluation metrics
        </label>
      </div>
      <div id="evalIdsRow" style="display:none;margin-bottom:12px">
        <input type="text" id="relevantIds" placeholder="Relevant candidate IDs (comma-separated) e.g. sarah_chen, priya_nair">
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="submitBtn" onclick="runScreening()">▶ Screen Candidates</button>
        <button class="btn btn-secondary" id="batchBtn" onclick="runBatch()">⚡ Batch Mode</button>
      </div>
    </div>
  </div>

  <div id="status"></div>
  <div id="validationBox"></div>
  <div id="faissBar"></div>

  <div id="results">
    <div class="results-top">
      <div class="results-heading">Results</div>
      <div class="results-meta" id="resultsMeta"></div>
    </div>
    <div id="metricsPanel"></div>
    <div id="resultCards"></div>
  </div>

</div>

<script>
  const API = 'http://localhost:8000';
  let resumeCount = 0;

  document.getElementById('withEval').addEventListener('change', e => {
    document.getElementById('evalIdsRow').style.display = e.target.checked ? 'block' : 'none';
  });

  async function checkHealth() {
    try {
      const res  = await fetch(`${API}/health`);
      const data = await res.json();
      document.getElementById('statusDot').classList.remove('offline');
      document.getElementById('statusText').textContent = 'API Online · v' + (data.version || '4.0');
      updateSystemBar(data);
    } catch {
      document.getElementById('statusDot').classList.add('offline');
      document.getElementById('statusText').textContent = 'API Offline';
    }
  }

  function updateSystemBar(data) {
    const idx   = data.index;
    const cache = data.cache?.cache;
    const jobs  = data.jobs;
    document.getElementById('sysIndex').textContent    = idx   ? idx.index_type         : '—';
    document.getElementById('sysIndex').className      = idx   ? 'sys-val'              : 'sys-val na';
    document.getElementById('sysVectors').textContent  = idx   ? idx.n_vectors          : '—';
    document.getElementById('sysVectors').className    = idx   ? 'sys-val'              : 'sys-val na';
    document.getElementById('sysDim').textContent      = idx   ? idx.dimension          : '—';
    document.getElementById('sysDim').className        = idx   ? 'sys-val'              : 'sys-val na';
    document.getElementById('sysCacheHit').textContent = cache ? cache.hit_rate_pct+'%' : '—';
    document.getElementById('sysCacheHit').className   = cache ? 'sys-val'              : 'sys-val na';
    document.getElementById('sysJobs').textContent     = jobs  ? jobs.total_jobs        : '0';
  }

  function addResume(id = '', text = '') {
    resumeCount++;
    const div = document.createElement('div');
    div.className = 'resume-row';
    div.innerHTML = `
      <input type="text" placeholder="Candidate ID" value="${id}" class="r-id">
      <textarea placeholder="Paste resume text here…" class="r-text" rows="3">${text}</textarea>
      <button class="rm-btn" onclick="this.parentElement.remove();updateCount()">×</button>
    `;
    document.getElementById('resumeList').appendChild(div);
    updateCount();
  }

  function updateCount() {
    const n = document.querySelectorAll('.resume-row').length;
    document.getElementById('resumeCount').textContent = n + ' added';
  }

  function clearAll() {
    document.getElementById('resumeList').innerHTML = '';
    resumeCount = 0;
    updateCount();
  }

  function loadExample() {
    document.getElementById('jd').value =
      'We are hiring a Senior Machine Learning Engineer to join our AI team. ' +
      'You will design, fine-tune, and deploy large language models in production. ' +
      'Requirements: 4+ years ML engineering, strong Python and PyTorch, LLM fine-tuning ' +
      '(LoRA, RLHF), vector databases (FAISS, Pinecone), deployment at scale (AWS, Docker, Kubernetes).';
    clearAll();
    [
      ['sarah_chen', 'Sarah Chen | San Francisco\nSenior ML Engineer at Scale AI. Fine-tuned LLaMA 2/3 with LoRA and QLoRA. Built RLHF pipelines. Deployed FAISS semantic search at 50M queries/day. MS Computer Science Stanford 2020.\nSkills: Python, PyTorch, HuggingFace, FAISS, LangChain, AWS, Docker, Kubernetes'],
      ['priya_nair',  'Priya Nair | New York\nNLP Research Scientist at Bloomberg AI. Fine-tuned BERT/GPT on financial NLP. RLHF experiments. Built RAG pipeline with FAISS + LangChain. PhD Columbia 2021. 3 ACL/EMNLP papers on LoRA fine-tuning.\nSkills: Python, PyTorch, HuggingFace, FAISS, LoRA, RLHF, AWS'],
      ['raj_patel',   'Raj Patel | Austin TX\nSenior Backend Engineer at Stripe. High-throughput payment APIs. PostgreSQL, Redis, AWS. Recently integrated OpenAI API for ticket classification. No model training experience.\nSkills: Python, Go, AWS, Kubernetes, Docker, PostgreSQL'],
    ].forEach(([id, text]) => addResume(id, text));
    document.getElementById('withEval').checked = true;
    document.getElementById('evalIdsRow').style.display = 'block';
    document.getElementById('relevantIds').value = 'sarah_chen, priya_nair';
  }

  function collectResumes() {
    return [...document.querySelectorAll('.resume-row')]
      .map(r => ({ resume_id: r.querySelector('.r-id').value.trim(), text: r.querySelector('.r-text').value.trim() }))
      .filter(r => r.resume_id && r.text);
  }

  function setLoading(msg) {
    const el = document.getElementById('status');
    el.className = 'loading';
    el.innerHTML = `<div class="spinner"></div> ${msg}`;
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('batchBtn').disabled  = true;
  }

  function setError(msg) {
    const el = document.getElementById('status');
    el.className = 'error';
    el.innerHTML = `<span>⚠</span> ${msg}`;
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('batchBtn').disabled  = false;
  }

  function clearStatus() {
    document.getElementById('status').className = '';
    document.getElementById('status').innerHTML = '';
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('batchBtn').disabled  = false;
  }

  async function runScreening() {
    const jd        = document.getElementById('jd').value.trim();
    const resumes   = collectResumes();
    const topN      = parseInt(document.getElementById('topN').value) || 5;
    const withEval  = document.getElementById('withEval').checked;
    const relRaw    = document.getElementById('relevantIds').value;
    const relevantIds = withEval && relRaw ? relRaw.split(',').map(s => s.trim()).filter(Boolean) : null;

    if (!jd)             return setError('Please enter a job description.');
    if (!resumes.length) return setError('Please add at least one candidate.');

    setLoading('Running two-stage pipeline…');
    document.getElementById('results').style.display = 'none';
    document.getElementById('validationBox').style.display = 'none';
    document.getElementById('faissBar').style.display = 'none';

    try {
      const res  = await fetch(`${API}/rank`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          job_description: jd, resumes, top_n: topN,
          ...(relevantIds ? { relevant_ids: relevantIds, eval_k_values: [1, 3, 5] } : {}),
        }),
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail?.message || err.detail || `HTTP ${res.status}`);
      }
      clearStatus();
      renderResults(await res.json());
      checkHealth();
    } catch (e) {
      setError(e.message || 'Could not reach API. Is python run.py running?');
    }
  }

  async function runBatch() {
    const jd      = document.getElementById('jd').value.trim();
    const resumes = collectResumes();
    const topN    = parseInt(document.getElementById('topN').value) || 5;

    if (!jd)             return setError('Please enter a job description.');
    if (!resumes.length) return setError('Please add at least one candidate.');

    setLoading('Submitting batch job…');
    try {
      const res  = await fetch(`${API}/rank/batch`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ queries: [{ job_description: jd, resumes, top_n: topN }] }),
      });
      const data = await res.json();
      setLoading(`Job queued (${data.job_id.slice(0,8)}…) — polling…`);
      pollJob(data.job_id);
    } catch (e) {
      setError(e.message || 'Batch submission failed.');
    }
  }

  async function pollJob(jobId) {
    let attempts = 0;
    const iv = setInterval(async () => {
      attempts++;
      try {
        const res  = await fetch(`${API}/jobs/${jobId}`);
        const data = await res.json();
        if (data.status === 'done') {
          clearInterval(iv);
          clearStatus();
          const result = Array.isArray(data.result) ? data.result[0] : data.result;
          renderResults(result);
          checkHealth();
        } else if (data.status === 'error') {
          clearInterval(iv);
          setError('Batch job failed: ' + (data.error || 'unknown'));
        } else {
          setLoading(`Job ${data.status} (${data.elapsed_s || 0}s)… polling…`);
        }
      } catch { }
      if (attempts >= 60) { clearInterval(iv); setError('Job timed out.'); }
    }, 1000);
  }

  function renderResults(data) {
    // validation warnings
    const val = data.validation;
    if (val && val.n_warnings > 0) {
      const box = document.getElementById('validationBox');
      box.style.display = 'block';
      box.innerHTML = `<strong style="letter-spacing:0.1em;text-transform:uppercase;font-size:10px">${val.n_warnings} Validation Warning${val.n_warnings > 1 ? 's' : ''}</strong><br><br>` +
        val.warnings.map(w => `<div class="warn-item">${w.resume_id ? `[${w.resume_id}] ` : ''}${w.message}</div>`).join('');
    }

    // FAISS info
    const fi = data.faiss_info;
    if (fi) {
      const bar = document.getElementById('faissBar');
      bar.style.display = 'flex';
      bar.innerHTML = `
        <div class="faiss-item">INDEX <span class="faiss-val">${fi.index_type}</span></div>
        <div class="faiss-item">VECTORS <span class="faiss-val">${fi.n_vectors}</span></div>
        <div class="faiss-item">DIM <span class="faiss-val">${fi.dimension}</span></div>
        <div class="faiss-item">SIZE <span class="faiss-val">${fi.index_size_mb}MB</span></div>
        ${fi.nprobe ? `<div class="faiss-item">NPROBE <span class="faiss-val">${fi.nprobe}</span></div>` : ''}
      `;
    }

    // timing
    const t = data.timing || {};
    document.getElementById('resultsMeta').innerHTML =
      `${data.total_candidates} candidates screened<br>` +
      `Total: ${t.total_s?.toFixed(2)}s &nbsp;·&nbsp; Embed: ${t.index_build_s?.toFixed(2)}s &nbsp;·&nbsp; Rerank: ${t.rerank_s?.toFixed(2)}s`;

    // metrics
    const mp  = document.getElementById('metricsPanel');
    const rep = data.metrics_report;
    if (rep) {
      mp.style.display = 'block';
      const key = (rep.metrics || []).filter(m => ['ndcg@5','ndcg@3','precision@3','recall@3','mrr'].includes(m.name)).slice(0, 5);
      mp.innerHTML = `
        <div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px">Evaluation Metrics</div>
        <div class="metrics-grade">
          <div class="grade-circle">
            <div class="grade-letter">${rep.overall_grade}</div>
            <div class="grade-label-text">${rep.overall_label}</div>
          </div>
          <div class="grade-verdict">${rep.verdict}</div>
        </div>
        <div class="metrics-grid">
          ${key.map(m => `
            <div class="metric-cell">
              <div class="metric-name">${m.name}</div>
              <div class="metric-val grade-${m.grade}">${(m.value*100).toFixed(0)}%</div>
              <div class="metric-grade grade-${m.grade}">${m.grade} — ${m.grade_label}</div>
            </div>`).join('')}
        </div>`;
    } else {
      mp.style.display = 'none';
    }

    // cards
    const container = document.getElementById('resultCards');
    container.innerHTML = '';
    (data.results || []).forEach((r, i) => {
      const conf  = r.confidence || {};
      const level = conf.level || 'uncertain';
      const card  = document.createElement('div');
      card.className = `result-card rank-${i}`;
      card.style.animationDelay = `${i * 0.07}s`;
      card.innerHTML = `
        <div class="card-top">
          <div class="rank-col"><div class="rank-num">${i + 1}</div></div>
          <div class="card-main">
            <div class="card-id-row">
              <div class="card-id">${r.resume_id}</div>
              <div class="confidence-badge conf-${level}">${conf.label || level}</div>
              ${conf.is_clear_winner ? '<div class="winner-badge">★ Clear Winner</div>' : ''}
              ${r.fallback_used ? '<div class="fallback-tag">⟳ Fallback Used</div>' : ''}
            </div>
            <div class="card-snippet">${r.text_snippet}</div>
            <div class="scores-row">
              ${sb('Final',    r.final_score,          i)}
              ${sb('Semantic', r.embedding_score,      i)}
              ${sb('Rerank',   r.rerank_score,         i)}
              ${r.fallback_used ? sb('Keyword', r.fallback?.score || 0, i) : ''}
            </div>
          </div>
        </div>
        <div class="card-footer">
          <div class="footer-reason">${conf.reason || ''}</div>
          ${conf.score_gap > 0 ? `<div class="footer-gap">Gap to next: <span>${(conf.score_gap*100).toFixed(1)}%</span></div>` : ''}
          ${r.fallback_used && r.fallback ? `<div class="footer-gap">Keywords: <span>${r.fallback.matched_keywords.slice(0,5).join(', ')}</span></div>` : ''}
        </div>`;
      container.appendChild(card);
    });

    document.getElementById('results').style.display = 'block';
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function sb(label, val, rank) {
    const pct = Math.round((val || 0) * 100);
    return `<div class="score-block">
      <div class="score-name">${label}</div>
      <div class="score-bar-wrap">
        <div class="score-bar"><div class="score-fill rank-${rank}" style="width:${pct}%"></div></div>
        <div class="score-pct">${pct}%</div>
      </div></div>`;
  }

  checkHealth();
  addResume(); addResume(); addResume();
  setInterval(checkHealth, 30000);
</script>
</body>
</html>
