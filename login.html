<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Screener — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #080808; --s1: #111; --s2: #181818; --s3: #222;
    --border: #282828; --border2: #333;
    --accent: #e8ff47; --accent2: #47d9ff; --accent3: #ff6b47;
    --text: #f0f0ee; --muted: #555; --muted2: #777;
    --uncertain: #ff4747; --good: #47ff8c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inconsolata', monospace; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 40% at 20% 20%, rgba(232,255,71,0.04) 0%, transparent 60%), radial-gradient(ellipse 50% 30% at 80% 80%, rgba(71,217,255,0.03) 0%, transparent 60%); pointer-events: none; }
  body::after { content: ''; position: fixed; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); pointer-events: none; }

  .container { width: 100%; max-width: 420px; padding: 24px; position: relative; z-index: 1; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }

  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 48px; }
  .logo-square { width: 32px; height: 32px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; color: #000; }
  .logo-text { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted2); }

  .heading { font-family: 'Syne', sans-serif; font-size: 40px; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; margin-bottom: 8px; }
  .heading .line1 { display: block; color: var(--text); }
  .heading .line2 { display: block; color: var(--accent); }
  .subheading { font-size: 11px; color: var(--muted2); letter-spacing: 0.08em; margin-bottom: 40px; }

  /* Tabs */
  .tabs { display: flex; margin-bottom: 24px; border: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px; font-family: 'Inconsolata', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; background: none; border: none; color: var(--muted); transition: all 0.15s; }
  .tab.active { background: var(--accent); color: #000; }
  .tab:not(.active):hover { color: var(--text); }

  /* Form */
  .form { display: flex; flex-direction: column; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted2); }
  .form-input { background: var(--s2); border: 1px solid var(--border); color: var(--text); font-family: 'Inconsolata', monospace; font-size: 13px; padding: 12px 14px; outline: none; transition: border-color 0.15s; width: 100%; }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--muted); }

  .submit-btn { margin-top: 8px; background: var(--accent); color: #000; font-family: 'Inconsolata', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 14px; border: none; cursor: pointer; transition: all 0.15s; width: 100%; }
  .submit-btn:hover { background: #f0ff60; }
  .submit-btn:disabled { background: var(--s3); color: var(--muted); cursor: not-allowed; }

  .message { padding: 10px 14px; font-size: 11px; letter-spacing: 0.06em; margin-top: 8px; display: none; }
  .message.error { background: rgba(255,71,71,0.06); border: 1px solid rgba(255,71,71,0.3); color: var(--uncertain); display: block; }
  .message.success { background: rgba(71,255,140,0.06); border: 1px solid rgba(71,255,140,0.3); color: var(--good); display: block; }

  .plan-info { margin-top: 24px; background: var(--s1); border: 1px solid var(--border); padding: 14px; }
  .plan-title { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .plan-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted2); margin-bottom: 6px; }
  .plan-row::before { content: '▸'; color: var(--accent); font-size: 9px; }
  .plan-row:last-child { margin-bottom: 0; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-square">RS</div>
    <div class="logo-text">Resume Screener</div>
  </div>

  <div class="heading">
    <span class="line1">SCREEN</span>
    <span class="line2">SMARTER.</span>
  </div>
  <div class="subheading">AI-powered resume screening for modern recruiters</div>

  <div class="tabs">
    <button class="tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
    <button class="tab" id="signupTab" onclick="switchTab('signup')">Create Account</button>
  </div>

  <!-- Login form -->
  <div id="loginForm" class="form">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="loginEmail" placeholder="you@company.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="submit-btn" id="loginBtn" onclick="handleLogin()">▶ Sign In</button>
    <div class="message" id="loginMsg"></div>
  </div>

  <!-- Signup form -->
  <div id="signupForm" class="form" style="display:none">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-input" id="signupName" placeholder="Ritvik Malhotra">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="signupEmail" placeholder="you@company.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="signupPassword" placeholder="Min 8 characters">
    </div>
    <button class="submit-btn" id="signupBtn" onclick="handleSignup()">▶ Create Free Account</button>
    <div class="message" id="signupMsg"></div>
  </div>

  <div class="plan-info">
    <div class="plan-title">Free Plan Includes</div>
    <div class="plan-row">5 screenings per month</div>
    <div class="plan-row">AI explanations + skill gap analysis</div>
    <div class="plan-row">Red flag detection</div>
    <div class="plan-row">Upgrade to Pro for unlimited screenings</div>
  </div>
</div>

<script>
  const SUPABASE_URL  = 'https://yvtvzpiqemcjgxyyycde.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2dHZ6cGlxZW1jamd4eXl5Y2RlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjMxNTAsImV4cCI6MjA5Mzk5OTE1MH0.bcfyypurM7Jk026AsxTJLBkPGtaU2FPrRCqWsMcm5A0';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Check if already logged in
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'dashboard.html';
  });

  function switchTab(tab) {
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('signupTab').classList.toggle('active', tab === 'signup');
    document.getElementById('loginForm').style.display  = tab === 'login'  ? 'flex' : 'none';
    document.getElementById('signupForm').style.display = tab === 'signup' ? 'flex' : 'none';
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.className = `message ${type}`;
    el.textContent = text;
  }

  async function handleLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showMsg('loginMsg', 'Please fill in all fields.', 'error');

    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      showMsg('loginMsg', error.message, 'error');
      btn.disabled = false; btn.textContent = '▶ Sign In';
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  async function handleSignup() {
    const name     = document.getElementById('signupName').value.trim();
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!name || !email || !password) return showMsg('signupMsg', 'Please fill in all fields.', 'error');
    if (password.length < 8)          return showMsg('signupMsg', 'Password must be at least 8 characters.', 'error');

    const btn = document.getElementById('signupBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';

    const { error } = await supabase.auth.signUp({
      email, password,
      options: { data: { full_name: name } }
    });

    if (error) {
      showMsg('signupMsg', error.message, 'error');
      btn.disabled = false; btn.textContent = '▶ Create Free Account';
    } else {
      showMsg('signupMsg', 'Account created! Check your email to confirm, then sign in.', 'success');
      btn.disabled = false; btn.textContent = '▶ Create Free Account';
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('loginForm').style.display !== 'none') handleLogin();
    else handleSignup();
  });
</script>
</body>
</html>
