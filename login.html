<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Screener - Login</title>
<meta name="description" content="Sign in to Resume Screener to rank candidates against a job description.">
<meta name="theme-color" content="#0a0b0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d8f36a'/%3E%3Ctext x='16' y='22' font-family='Syne,Verdana,sans-serif' font-size='15' font-weight='800' text-anchor='middle' fill='%230a0b0e'%3ERS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inconsolata:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0e; --s1: #101217; --s2: #15181f; --s3: #1c2028;
    --border: #1e222b; --border2: #2b313c;
    --accent: #d8f36a; --text: #f2f4f1; --muted: #7d8798; --muted2: #a7b0bf;
    --uncertain: #e07a7a; --good: #9fe07f;
    --glow: rgba(216,243,106,0.16);
    --shadow-2: 0 8px 24px -8px rgba(4,6,10,0.85);
    --ease-out: cubic-bezier(0.16,1,0.3,1);
    --ease-snap: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-io: cubic-bezier(0.65,0,0.35,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  input { caret-color: var(--accent); }
  body {
    background: var(--bg); color: var(--text); font-family: Inconsolata, monospace;
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* Same ambient aurora as the app, so sign-in reads as the same product. */
  body::before {
    content: ''; position: fixed; inset: -25%; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 44% 34% at 22% 18%, rgba(216,243,106,0.11), transparent 62%),
      radial-gradient(ellipse 38% 30% at 80% 80%, rgba(143,196,224,0.07), transparent 62%);
    animation: drift 34s var(--ease-io) infinite alternate; will-change: transform;
  }
  @keyframes drift {
    0% { transform: translate3d(0,0,0) scale(1); }
    50% { transform: translate3d(2.5%,-2%,0) scale(1.06); }
    100% { transform: translate3d(-2%,2.5%,0) scale(1.02); }
  }

  .container { width: 100%; max-width: 440px; padding: 28px 22px; position: relative; z-index: 1; animation: rise 0.8s var(--ease-out) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 44px; }
  .logo-square { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: Syne, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: -0.02em; color: #0a0b0e; box-shadow: 0 6px 18px -6px rgba(4,6,10,0.9); transition: transform 0.4s var(--ease-snap); }
  .logo:hover .logo-square { transform: rotate(-8deg) scale(1.08); }
  .logo-text { font-family: Syne, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted2); }

  .heading { font-family: Syne, sans-serif; font-size: clamp(34px, 10.2vw, 52px); font-weight: 800; line-height: 0.88; letter-spacing: -0.04em; margin-bottom: 10px; }
  .line1 { display: block; color: var(--text); }
  .line2 { display: block; color: transparent; -webkit-text-stroke: 1.2px var(--accent); animation: fillIn 1s var(--ease-out) 0.5s forwards; }
  @keyframes fillIn { to { color: var(--accent); -webkit-text-stroke-color: transparent; } }
  .subheading { font-size: 12px; color: var(--muted2); letter-spacing: 0.06em; margin: 16px 0 34px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 11px; background: var(--s1); margin-bottom: 24px; }
  .tab { padding: 12px 10px; font-family: Inconsolata, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; background: transparent; border: none; border-radius: 8px; color: var(--muted); transition: background 0.25s var(--ease-out), color 0.25s var(--ease-out); }
  .tab:hover:not(.active) { color: var(--text); background: var(--s2); }
  .tab.active { background: var(--accent); color: #0a0b0e; box-shadow: 0 6px 18px -6px rgba(4,6,10,0.9); }
  .tab:focus-visible { outline-offset: -2px; }

  .form { display: none; flex-direction: column; gap: 15px; }
  .form.active { display: flex; animation: rise 0.45s var(--ease-out) both; }
  .form-label { display: block; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted2); margin-bottom: 7px; }
  .form-input { display: block; width: 100%; background: var(--s2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: Inconsolata, monospace; font-size: 13px; padding: 13px 15px; outline: none; transition: border-color 0.25s var(--ease-out), box-shadow 0.3s var(--ease-out), background 0.25s var(--ease-out); }
  .form-input:hover { border-color: var(--border2); }
  .form-input:focus { border-color: var(--accent); background: var(--s1); box-shadow: 0 0 0 3px var(--glow); }
  .form-input::placeholder { color: var(--muted); }

  .submit-btn { position: relative; overflow: hidden; display: block; width: 100%; background: var(--accent); color: #0a0b0e; font-family: Inconsolata, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; padding: 15px; border: none; border-radius: 10px; cursor: pointer; margin-top: 4px; transition: box-shadow 0.3s var(--ease-out), transform 0.2s var(--ease-snap), background 0.25s var(--ease-out); }
  .submit-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,0.42) 50%, transparent 62%); transform: translateX(-120%); transition: transform 0.7s var(--ease-out); }
  .submit-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px -8px rgba(4,6,10,0.95); }
  .submit-btn:hover:not(:disabled)::after { transform: translateX(120%); }
  .submit-btn:active:not(:disabled) { transform: scale(0.985); }
  .submit-btn:disabled { background: var(--s3); color: var(--muted); cursor: not-allowed; }

  .message { padding: 11px 15px; font-size: 11px; line-height: 1.55; display: none; margin-top: 4px; border-radius: 9px; }
  .message.error { display: block; background: rgba(224,122,122,0.07); border: 1px solid rgba(224,122,122,0.45); color: var(--uncertain); }
  .message.success { display: block; background: rgba(159,224,127,0.07); border: 1px solid rgba(159,224,127,0.45); color: var(--good); }

  .plan-info { margin-top: 30px; background: linear-gradient(180deg, rgba(255,255,255,0.026), rgba(255,255,255,0.006)), var(--s1); border: 1px solid var(--border2); border-radius: 14px; padding: 20px 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
  .plan-title { font-family: Syne, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  .plan-row { font-size: 11px; color: var(--muted2); margin-bottom: 7px; padding-left: 16px; position: relative; }
  .plan-row::before { content: ""; position: absolute; left: 1px; top: 6px; width: 4px; height: 4px; border-radius: 1px; transform: rotate(45deg); background: var(--accent); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  ::selection { background: var(--accent); color: #0a0b0e; }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-square">RS</div>
    <div class="logo-text">Resume Screener</div>
  </div>
  <div class="heading"><span class="line1">SCREEN</span><span class="line2">SMARTER.</span></div>
  <div class="subheading">AI-powered resume screening for modern recruiters</div>
  <div class="tabs">
    <button class="tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
    <button class="tab" id="signupTab" onclick="switchTab('signup')">Create Account</button>
  </div>
  <div id="loginForm" class="form active">
    <div><label class="form-label" for="loginEmail">Email</label><input type="email" class="form-input" id="loginEmail" placeholder="you@company.com"></div>
    <div><label class="form-label" for="loginPassword">Password</label><input type="password" class="form-input" id="loginPassword" placeholder="Min 8 characters"></div>
    <button class="submit-btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
    <div class="message" id="loginMsg"></div>
  </div>
  <div id="signupForm" class="form">
    <div><label class="form-label" for="signupName">Full Name</label><input type="text" class="form-input" id="signupName" placeholder="Your Name"></div>
    <div><label class="form-label" for="signupEmail">Email</label><input type="email" class="form-input" id="signupEmail" placeholder="you@company.com"></div>
    <div><label class="form-label" for="signupPassword">Password</label><input type="password" class="form-input" id="signupPassword" placeholder="Min 8 characters"></div>
    <button class="submit-btn" id="signupBtn" onclick="handleSignup()">Create Free Account</button>
    <div class="message" id="signupMsg"></div>
  </div>
  <div class="plan-info">
    <div class="plan-title">Free Plan Includes</div>
    <div class="plan-row">5 screenings per month</div>
    <div class="plan-row">AI explanations and skill gap analysis</div>
    <div class="plan-row">Red flag detection and JD analyser</div>
    <div class="plan-row">Upgrade to Pro for unlimited screenings</div>
  </div>
</div>
<script>
  const API = '';

  if (localStorage.getItem('token')) window.location.href = 'dashboard.html';

  function switchTab(tab) {
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('signupTab').classList.toggle('active', tab === 'signup');
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
  }

  function showMsg(id, text, type) {
    var el = document.getElementById(id);
    el.className = 'message ' + type;
    el.textContent = text;
  }

  function handleLogin() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    if (!email || !password) { showMsg('loginMsg', 'Please fill in all fields.', 'error'); return; }
    var btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';
    fetch(`${API}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: password }) })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(r) {
        if (!r.ok) { showMsg('loginMsg', r.data.detail || 'Login failed.', 'error'); btn.disabled = false; btn.textContent = 'Sign In'; return; }
        localStorage.setItem('token', r.data.token);
        window.location.href = 'dashboard.html';
      })
      .catch(function() { showMsg('loginMsg', 'Could not reach the server.', 'error'); btn.disabled = false; btn.textContent = 'Sign In'; });
  }

  function handleSignup() {
    var name = document.getElementById('signupName').value.trim();
    var email = document.getElementById('signupEmail').value.trim();
    var password = document.getElementById('signupPassword').value;
    if (!name || !email || !password) { showMsg('signupMsg', 'Please fill in all fields.', 'error'); return; }
    if (password.length < 8) { showMsg('signupMsg', 'Password must be at least 8 characters.', 'error'); return; }
    var btn = document.getElementById('signupBtn');
    btn.disabled = true; btn.textContent = 'Creating account...';
    fetch(`${API}/auth/signup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ full_name: name, email: email, password: password }) })
      .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
      .then(function(r) {
        if (!r.ok) { showMsg('signupMsg', r.data.detail || 'Signup failed.', 'error'); btn.disabled = false; btn.textContent = 'Create Free Account'; return; }
        localStorage.setItem('token', r.data.token);
        window.location.href = 'dashboard.html';
      })
      .catch(function() { showMsg('signupMsg', 'Could not reach the server.', 'error'); btn.disabled = false; btn.textContent = 'Create Free Account'; });
  }
</script>
</body>
</html>
